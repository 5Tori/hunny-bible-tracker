name: hunny_bible_tracker
description: Offline-first Bible reading tracker.
publish_to: "none"
version: 0.1.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.5.1
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.2
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  flutter_svg: ^2.3.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/bible_books.en.json
    - assets/brand/google_g.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app-icon.png"

  adaptive_icon_foreground: "assets/icon/app-icon.png"
  adaptive_icon_background: "#FFFFFF"

  remove_alpha_ios: true
